<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Farmacia Cristo Médico</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="dashboard">
        <!-- Barra Lateral -->
        <aside class="sidebar">
            <h3>💊 Cristo Médico</h3>
            <nav>
                <button onclick="showSection('inventario')" class="active">📦 Inventario y Almacén</button>
                <button onclick="showSection('registro')">➕ Registrar Producto</button>
                <button onclick="showSection('ventas')">🛒 Ventas</button>
                <button onclick="logout()" class="logout-btn">🚪 Cerrar Sesión</button>
            </nav>
        </aside>

        <!-- Contenido Principal -->
        <main class="content">
            <!-- SECCIÓN INVENTARIO -->
            <section id="inventario" class="section active">
                <h2>Inventario y Almacén</h2>
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Producto</th>
                            <th>Stock</th>
                            <th>Precio</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="inventarioBody">
                        <!-- Los productos se cargan aquí con JS -->
                    </tbody>
                </table>
            </section>

            <!-- SECCIÓN REGISTRO -->
            <section id="registro" class="section">
                <h2>Registrar Nuevo Producto</h2>
                <form id="productoForm" class="card-form">
                    <input type="text" id="prodName" placeholder="Nombre del medicamento" required>
                    <input type="number" id="prodStock" placeholder="Cantidad en almacén" required>
                    <input type="number" id="prodPrice" step="0.01" placeholder="Precio de venta" required>
                    <button type="submit">Guardar Producto</button>
                </form>
            </section>

            <!-- SECCIÓN VENTAS -->
            <section id="ventas" class="section">
                <h2>Punto de Venta</h2>
                <div class="card-form">
                    <select id="ventaProducto"></select>
                    <input type="number" id="ventaCantidad" placeholder="Cantidad a vender" min="1" required>
                    <button onclick="realizarVenta()">Realizar Venta</button>
                </div>
                <div id="ticket" class="ticket"></div>
            </section>
        </main>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
